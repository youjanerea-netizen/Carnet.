/* toasts */
.toasts { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: .5rem; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); pointer-events: none; }

<body>
<main id="app" class="main"></main>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------- utilitaires ---------- */
  var STORE_KEY = "carnet-v1";
  var PRIORITIES = [
    { id: "essentiel", label: "Essentiel", hint: "Ne peut pas attendre" },
    { id: "important", label: "Important", hint: "À traiter bientôt" },
    { id: "secondaire", label: "Secondaire", hint: "Quand tu as le temps" },
    { id: "futile", label: "Futile", hint: "Si l’envie y est" }
  ];

  function nid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }
  function cx() { return Array.prototype.filter.call(arguments, Boolean).join(" "); }
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  // Ariary : pas de centimes, montants entiers
  function ariary(n) {
    return new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 }).format(Math.round(n)) + "\u00A0Ar";
  }
  function parseFrNumber(raw) {
    var t = String(raw).replace(/\s/g, "").replace(",", ".").replace(/[^\d.+-]/g, "");
    if (!t || t === "+" || t === "-" || t === ".") return null;
    var n = Number(t);
    return isFinite(n) ? n : null;
  }
  function formatFrNumber(n) {
    if (!isFinite(n)) return "Erreur";
    var rounded = Number(Number(n).toPrecision(12));
    return new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 8 }).format(rounded);
  }
  function isSameDay(ts) {
    var a = new Date(ts), b = new Date();
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function formatEdit(n) { return String(n).replace(".", ","); }

            }) : null),
          h("button", {
            type: "button", class: "iconbtn soft", "aria-expanded": open, "aria-label": "Afficher la note",
            onclick: function () { U.to[id] = !open; render(); }
          }, icon("chevronDown", cx("i-4", "chev", open && "open"))),
          h("button", {
            type: "button", class: "iconbtn soft danger", "aria-label": "Supprimer « " + task.title + " »",
            onclick: function () { onRemove(task); }
          }, icon("trash", "i-4")))));
  }

  function EmptyTasks() {
    return h("div", { key: "empty", class: "card empty" },
      icon("notebookPen", "i-9", 1.5),
      h("h2", {}, "Rien d’ouvert"),
      h("p", {}, "Écris ce qui compte vraiment, de l’essentiel au futile. Coche, et ça disparaît."));
  }

  /* --- courses --- */
  function Shopping() {
    var list = 0, cart = 0, remaining = 0;
    S.items.forEach(function (i) {
      var v = i.qty * i.price;
      list += v;
      if (i.bought) cart += v; else remaining += v;
    });
    var leftover = S.budget === null ? null : S.budget - list;
    var boughtCount = S.items.filter(function (i) { return i.bought; }).length;

    function handleAdd(e) {
      e.preventDefault();
      var q = parseFrNumber(U.qty); if (q === null) q = 1;
      var p = parseFrNumber(U.price); if (p === null) p = 0;
      addItem(U.name.trim() || "Article", q, p);
      U.name = ""; U.qty = "1"; U.price = "";
      render();
    }
    function handleRemove(item) {
      var snap = removeItem(item.id);
      if (!snap) return;
      toast("Article retiré", { action: { label: "Annuler", onClick: function () { insertItem(snap); } } });
    }
    function commitBudget() {
      var parsed = parseFrNumber(U.budgetDraft);
      setBudget(parsed);
      U.budgetDraft = parsed === null ? "" : formatEdit(parsed);
      render();
    }

    return h("div", { key: "shopping", class: "shop" },
      h("section", { key: "ticket", class: "card p4 ticket" },
        h("p", { class: "eyebrow" }, "Ticket"),
        h("div", { class: "stats" },
          Stat("Liste", ariary(list)),
          Stat("Panier", ariary(cart)),
          Stat("Reste à prendre", ariary(remaining)),
          h("div", {},
            h("p", { class: "xs muted" }, "Budget"),
            h("input", {
              class: "field budget tabular", inputmode: "decimal", "aria-label": "Budget courses",
              value: U.budgetDraft, placeholder: "Libre",
              oninput: function (e) { U.budgetDraft = e.target.value; },
              onblur: commitBudget,
              onkeydown: function (e) { if (e.key === "Enter") e.target.blur(); }
            }),
            leftover !== null
              ? h("p", { class: cx("budget-msg tabular", leftover < 0 ? "over" : "under") },
                  leftover < 0 ? "Dépassement " + ariary(Math.abs(leftover)) : "Il reste " + ariary(leftover))
              : h("p", { class: "budget-msg subtle" }, "Optionnel")))),

      h("div", { key: "calc", class: "calc-wrap" }, Calculator(function (value) {
        addItem("Article", 1, value);
        toast("Ajouté au ticket", { description: ariary(value) });
      })),

      h("form", { key: "add", class: "card p4 addform", onsubmit: handleAdd },
        h("h2", { class: "h2" }, "Ajouter un article"),
        h("div", { class: "addgrid" },
          h("input", {
            class: "field", value: U.name, placeholder: "Pain, lait, fruits…", autocomplete: "off", "aria-label": "Nom de l’article",
            oninput: function (e) { U.name = e.target.value; }
          }),
          h("input", {
            class: "field tabular", inputmode: "decimal", value: U.qty, "aria-label": "Quantité", placeholder: "Qté",
            oninput: function (e) { U.qty = e.target.value; }
          }),
          h("input", {
            class: "field tabular", inputmode: "decimal", value: U.price, "aria-label": "Prix unitaire", placeholder: "Prix Ar",
            oninput: function (e) { U.price = e.target.value; }
          }),
          h("button", { type: "submit", class: "btn full" }, icon("plus", "i-4"), "Ajouter"))),

      S.items.length === 0 ? EmptyCart() :
        h("section", { key: "cart", class: "card group cartlist" },
          h("header", { class: "cart-head" },
            h("div", {},
              h("h2", { class: "h2" }, "Courses"),
              h("p", { class: "sm muted" },
                S.items.length + " article" + (S.items.length > 1 ? "s" : "") +
                (boughtCount ? " · " + boughtCount + " dans le panier" : ""))),
            boughtCount > 0 ? h("button", { type: "button", class: "btn ghost-sm", onclick: clearBought }, "Retirer les achetés") : null),
          h("ul", {}, S.items.map(function (item) { return CartRow(item, handleRemove); })),
          h("footer", { class: "cart-foot" },
            h("span", { class: "sm muted" }, "Total du ticket"),
            h("span", { class: "total tabular" }, ariary(list)))));
  }

  function Stat(label, value) {
    return h("div", {}, h("p", { class: "xs muted" }, label), h("p", { class: "stat-v tabular" }, value));
  }

  function CartRow(item, onRemove) {
    var id = item.id;
    var name = U.iname[id] !== undefined ? U.iname[id] : item.name;
    var price = U.iprice[id] !== undefined ? U.iprice[id] : formatEdit(item.price);
    var line = item.qty * item.price;
    return h("li", { key: id, class: "cart-row" },
      h("div", { class: "row", style: "border-top:0;padding:0" },
        h("button", {
          type: "button", class: "iconbtn", "aria-pressed": item.bought,
          "aria-label": item.bought ? "Remettre " + item.name : "Cocher " + item.name,
          onclick: function () { toggleBought(id); }
        }, h("span", { class: cx("task-check", item.bought && "is-on") }, icon("check", "i-3", 3))),
        h("div", { class: "rowbody" },
          h("input", {
            class: cx("rowinput", item.bought && "bought"), value: name, "aria-label": "Nom de l’article",
            oninput: function (e) { U.iname[id] = e.target.value; },
            onblur: function () {
              var d = U.iname[id]; delete U.iname[id];
              if (d !== undefined && d.trim() && d !== item.name) updateItem(id, { name: d }); else render();
            }
          }),
          h("div", { class: "cart-meta" },
            h("div", { class: "stepper" },
              h("button", {
                type: "button", "aria-label": "Diminuer la quantité",
                onclick: function () { updateItem(id, { qty: Math.max(0.01, roundQty(item.qty - (item.qty > 1 ? 1 : 0.5))) }); }
              }, icon("minus", "i-35")),
              h("span", { class: "q tabular" }, formatQty(item.qty)),
              h("button", {
                type: "button", "aria-label": "Augmenter la quantité",
                onclick: function () { updateItem(id, { qty: roundQty(item.qty + (item.qty >= 1 ? 1 : 0.5)) }); }
              }, icon("plus", "i-35"))),
            h("span", {}, "×"),
            h("input", {
              class: "priceinput tabular", inputmode: "decimal", value: price, "aria-label": "Prix unitaire",
              oninput: function (e) { U.iprice[id] = e.target.value; },
              onblur: function () {
                var raw = U.iprice[id]; delete U.iprice[id];
                if (raw === undefined) return;
                var parsed = parseFrNumber(raw);
                if (parsed === null) { render(); return; }
                updateItem(id, { price: parsed });
              },
              onkeydown: function (e) { if (e.key === "Enter") e.target.blur(); }
            }),
            h("span", { class: "line-total tabular" }, ariary(line)))),
        h("button", {
          type: "button", class: "iconbtn soft danger", "aria-label": "Supprimer " + item.name,
          onclick: function () { onRemove(item); }
        }, icon("trash", "i-4"))));
  }

  function EmptyCart() {
    return h("div", { key: "emptycart", class: "card empty" },
      icon("basket", "i-9", 1.5),
      h("h2", {}, "Liste vide"),
      h("p", {}, "Ajoute les articles, leurs prix, et suis le total. La calculatrice sert à la caisse."));
  }

  function Calculator(onAddToTicket) {
    var st = U.calc;
    var value = currentValue(st);
    var disabled = value === null || value === 0;
    return h("section", { class: "card p4" },
      h("header", { class: "calc-head" },
        h("div", {},
          h("p", { class: "eyebrow" }, "Caisse"),
          h("h2", { class: "h2" }, "Calculatrice")),
        st.op ? h("span", { class: "calc-op" }, st.op === "-" ? "−" : st.op) : null),
      h("div", { class: "calc-screen" },
        h("p", { class: cx("tabular", st.error && "err") }, st.display)),
      h("div", { class: "keys" }, KEYS.map(function (k) {
        return h("button", {
          key: k[0], type: "button", class: cx("key", k[2]), "aria-label": ARIA[k[1]] || k[1],
          onclick: function () { U.calc = reduceCalc(U.calc, k[1]); render(); }
        }, k[0] === "⌫" ? icon("backspace", "i-4") : k[0]);
      })),
      h("button", {
        type: "button", class: "btn secondary full mt3", disabled: disabled,
        onclick: function () {
          var v = currentValue(U.calc);
          if (v === null || v === 0) return;
          onAddToTicket(Math.abs(v));
          U.calc = initialCalc;
          render();
        }
      }, icon("plus", "i-4"), "Ajouter au ticket"));
  }

  /* ---------- démarrage ---------- */
  var root = document.getElementById("app");
  var rendering = false, again = false;
  function render() {
    if (rendering) { again = true; return; }
    rendering = true;
    try {
      do { again = false; updateEl(root, App()); } while (again);
    } finally { rendering = false; }
  }
  load();
  render();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
